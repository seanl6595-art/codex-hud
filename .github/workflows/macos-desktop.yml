name: macOS desktop internal preview
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'lib/**'
      - 'gui/**'
      - 'test/**'
      - 'e2e/**'
      - 'package*.json'
      - '.github/workflows/macos-desktop.yml'
  workflow_dispatch:
    inputs:
      retain_preview_artifacts:
        description: 'Upload internal preview ZIP/DMG for review (public-repo artifacts are not private; requires approval)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            os: '15'
          - runner: macos-15-intel
            arch: x64
            os: '15'
          - runner: macos-26
            arch: arm64
            os: '26'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CODEX_HUD_DESKTOP_SOAK_SECONDS: '90'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Require native matching architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MACOS: ${{ matrix.os }}
        run: |
          node -e 'if(process.platform!=="darwin"||process.arch!==process.env.EXPECTED_ARCH)process.exit(1)'
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != "1"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "$EXPECTED_MACOS"
          sw_vers
          uname -m
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Install pinned native Electron distribution
        run: node desktop/node_modules/electron/install.js
      - run: npm run build:gui
      - run: npm test
      - run: npm run test:desktop
      - run: npm --prefix desktop run make:mac -- ${{ matrix.arch }}
      - name: Gate signatures and launch final ZIP and DMG with embedded runtime, native suites and LaunchServices
        run: node desktop/scripts/verify-macos-artifacts.cjs
      - run: npx --no-install playwright install chrome
      - run: npm run test:browser
      - name: Preserve telemetry/accounting source
        run: git diff --exit-code -- bin lib gui LICENSE NOTICE.md
      - name: Retain preview only after explicit artifact approval
        # PR runs never distribute binaries. A new manual dispatch is required.
        if: >-
          ${{ success() && github.event_name == 'workflow_dispatch' && inputs.retain_preview_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-hud-${{ matrix.runner }}-${{ matrix.arch }}-internal
          retention-days: 7
          if-no-files-found: error
          # Build outputs are one level below macos/. Never traverse the DMG
          # staging volume's Applications symlink or packaged app directories.
          path: |
            desktop/out/macos/*-${{ matrix.arch }}-*/codex-hud-desktop-*-macos-${{ matrix.arch }}-internal.zip
            desktop/out/macos/*-${{ matrix.arch }}-*/codex-hud-desktop-*-macos-${{ matrix.arch }}-internal.dmg
            desktop/out/macos/*-${{ matrix.arch }}-*/SHA256SUMS
            desktop/out/macos/*-${{ matrix.arch }}-*/artifact-index.json
            desktop/out/macos/*-${{ matrix.arch }}-*/validated-internal.json
      # No push, commit, tag, GitHub Release, Developer ID or notarization step.
